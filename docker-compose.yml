services:
  adl-drafter:
    build: .
    image: adl-drafter:latest
    container_name: adl-drafter
    restart: unless-stopped
    ports:
      # Bound to localhost only — reachable via `tailscale serve` (Tailscale
      # HTTPS on 443) or an SSH tunnel, not directly over the LAN unencrypted.
      - "127.0.0.1:4000:4000"
    volumes:
      - adl-drafter-data:/app/data
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATA_DIR=/app/data

volumes:
  adl-drafter-data:
